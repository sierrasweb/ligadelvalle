<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel - Liga del Valle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>⚙️ Panel de Control</h1>
  </header>

  <div class="container">
    <div id="login-section" class="card">
      <h2>Iniciar Sesión</h2>
      <input type="email" id="email" placeholder="Correo electrónico">
      <input type="password" id="password" placeholder="Contraseña">
      <button id="btn-login">Ingresar</button>
      <p id="login-error" style="color:red; margin-top:10px;"></p>
    </div>

    <div id="admin-section" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span id="user-info"></span>
        <button id="btn-logout" class="danger" style="width: auto; padding: 5px 15px;">Salir</button>
      </div>

      <div class="card" style="margin-top:20px;">
        <h3>Crear Nuevo Partido</h3>
        <input type="text" id="new-home" placeholder="Equipo Local">
        <input type="text" id="new-away" placeholder="Equipo Visitante">
        <input type="number" id="new-matchday" placeholder="Fecha N°" value="1">
        <button id="btn-create-match">Crear Partido</button>
      </div>

      <div class="card">
        <h3>Administrar Partidos</h3>
        <div id="admin-matches-list">Cargando partidos...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBRg-ZamZqFXK-cynKIt6X-FJXDCdD6Osg",
      authDomain: "liga-del-valle.firebaseapp.com",
      databaseURL: "https://liga-del-valle-default-rtdb.firebaseio.com",
      projectId: "liga-del-valle",
      storageBucket: "liga-del-valle.firebasestorage.app",
      messagingSenderId: "421001437016",
      appId: "1:421001437016:web:afeb2b18ca82b9bc850f2d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginSection = document.getElementById("login-section");
    const adminSection = document.getElementById("admin-section");
    const btnLogin = document.getElementById("btn-login");
    const btnLogout = document.getElementById("btn-logout");
    const loginError = document.getElementById("login-error");
    const userInfo = document.getElementById("user-info");

    btnLogin.addEventListener("click", () => {
      signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value)
        .catch(err => loginError.textContent = "Error: Verifica tus datos.");
    });

    btnLogout.addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.style.display = "none";
        adminSection.style.display = "block";
        userInfo.textContent = `Usuario: ${user.email}`;
        loadAdminMatches();
      } else {
        loginSection.style.display = "block";
        adminSection.style.display = "none";
      }
    });

    document.getElementById("btn-create-match").addEventListener("click", async () => {
      const home = document.getElementById("new-home").value;
      const away = document.getElementById("new-away").value;
      const matchday = parseInt(document.getElementById("new-matchday").value);
      if(!home || !away) return alert("Completá los equipos.");

      await addDoc(collection(db, "matches"), {
        homeTeam: home, awayTeam: away, homeScore: 0, awayScore: 0,
        status: "SCHEDULED", minute: "0'", matchday: matchday, events: [], date: serverTimestamp()
      });
      alert("Partido creado.");
    });

    function loadAdminMatches() {
      onSnapshot(collection(db, "matches"), (snapshot) => {
        const list = document.getElementById("admin-matches-list");
        list.innerHTML = "";
        snapshot.forEach((matchDoc) => {
          const m = matchDoc.data();
          const div = document.createElement("div");
          div.className = "card";
          div.style.border = "1px solid #ccc";
          div.innerHTML = `
            <h4>${m.homeTeam} (${m.homeScore}) vs ${m.awayTeam} (${m.awayScore})</h4>
            <p>Estado: <strong>${m.status}</strong> | Minuto: <strong>${m.minute}</strong></p>
            <div style="margin-top:10px;">
              <button onclick="window.updateStatus('${matchDoc.id}', 'LIVE')">En Vivo</button>
              <button onclick="window.updateStatus('${matchDoc.id}', 'FINISHED')" class="danger">Finalizar</button>
            </div>
            <div style="margin-top:10px;">
              <input type="text" id="min-${matchDoc.id}" placeholder="Minuto (ej: 34')">
              <input type="text" id="player-${matchDoc.id}" placeholder="Jugador">
              <select id="type-${matchDoc.id}">
                <option value="Gol Local ⚽">Gol Local</option>
                <option value="Gol Visitante ⚽">Gol Visitante</option>
                <option value="Amarilla 🟨">Amarilla</option>
                <option value="Roja 🟥">Roja</option>
              </select>
              <button onclick="window.addEvent('${matchDoc.id}')">Añadir Evento</button>
            </div>
          `;
          list.appendChild(div);
        });
      });
    }

    window.updateStatus = async (id, status) => {
      await updateDoc(doc(db, "matches", id), { status: status });
    };

    window.addEvent = async (id) => {
      const min = document.getElementById(`min-${id}`).value;
      const player = document.getElementById(`player-${id}`).value;
      const type = document.getElementById(`type-${id}`).value;
      if(!min || !player) return alert("Faltan datos.");

      const matchRef = doc(db, "matches", id);
      
      // Actualizar marcador si es gol
      if(type === "Gol Local ⚽" || type === "Gol Visitante ⚽") {
         alert("Evento guardado. Recuerda actualizar el marcador si es necesario (se agregará automático en futuras versiones).");
      }

      await updateDoc(matchRef, {
        minute: min,
        events: arrayUnion({ minute: min, player: player, type: type })
      });
    };
  </script>
</body>
</html>
