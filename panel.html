<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    
    <!-- LOGIN -->
    <div id="login-section" class="admin-card" style="max-width: 400px; margin: 40px auto; text-align: center;">
      <h2 style="margin-bottom: 20px;">Acceso a Clubes</h2>
      <input type="email" id="email" placeholder="Correo electrónico">
      <input type="password" id="password" placeholder="Contraseña">
      <button id="btn-login">Ingresar</button>
      <p id="login-error" style="color: #EF4444; margin-top:10px;"></p>
    </div>

    <!-- PANEL ADMIN -->
    <div id="admin-section" style="display:none;">
      
      <div class="admin-card" style="display:flex; justify-content:space-between; align-items:center;">
        <span id="user-info" style="font-weight: bold; color: var(--live-color);"></span>
        <button id="btn-logout" class="danger" style="width: auto; padding: 5px 15px; margin:0;">Salir</button>
      </div>

      <!-- ESTO SOLO LO VES VOS (EL SUPER ADMIN) -->
      <div id="seccion-crear" class="admin-card" style="display:none; border: 2px solid var(--score-blue);">
        <h3 style="margin-bottom: 15px;">👑 Crear y Asignar Partido</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="new-home" placeholder="Equipo Local">
            <input type="text" id="new-away" placeholder="Equipo Visitante">
        </div>
        <input type="email" id="new-user" placeholder="Correo del encargado (Ej: club.boca@liga.com)">
        <button id="btn-create-match">Crear Partido</button>
      </div>

      <!-- LISTA DE PARTIDOS ASIGNADOS -->
      <h3 style="margin: 20px 0 10px;">⚽ Partidos Asignados</h3>
      <div id="admin-matches-list"></div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, arrayUnion, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyBRg-ZamZqFXK-cynKIt6X-FJXDCdD6Osg",
  authDomain: "liga-del-valle.firebaseapp.com",
  databaseURL: "https://liga-del-valle-default-rtdb.firebaseio.com",
  projectId: "liga-del-valle",
  storageBucket: "liga-del-valle.firebasestorage.app",
  messagingSenderId: "421001437016",
  appId: "1:421001437016:web:afeb2b18ca82b9bc850f2d"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- ¡ATENCIÓN! PONÉ TU CORREO REAL ACÁ ---
    const correoAdmin = "tu_correo@gmail.com"; 
    let currentUserEmail = "";

    const loginSection = document.getElementById("login-section");
    const adminSection = document.getElementById("admin-section");

    document.getElementById("btn-login").addEventListener("click", () => {
      signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value)
        .catch(() => document.getElementById("login-error").textContent = "Credenciales incorrectas.");
    });
    
    document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserEmail = user.email;
        loginSection.style.display = "none"; 
        adminSection.style.display = "block";
        document.getElementById("user-info").textContent = "Usuario: " + user.email;
        
        // Mostrar form de creación solo a vos
        if(user.email === correoAdmin) {
            document.getElementById("seccion-crear").style.display = "block";
        }
        
        loadAdminMatches();
      } else {
        loginSection.style.display = "block"; 
        adminSection.style.display = "none";
      }
    });

    document.getElementById("btn-create-match").addEventListener("click", async () => {
      const home = document.getElementById("new-home").value;
      const away = document.getElementById("new-away").value;
      const assignedUser = document.getElementById("new-user").value;
      
      if(!home || !away || !assignedUser) return alert("Completá todos los campos");
      
      await addDoc(collection(db, "matches"), {
        homeTeam: home, awayTeam: away, homeScore: 0, awayScore: 0,
        status: "SCHEDULED", baseMinute: 0, assignedUser: assignedUser.toLowerCase(),
        events: [], date: serverTimestamp()
      });
      alert("Partido creado y asignado.");
    });

    function loadAdminMatches() {
      onSnapshot(collection(db, "matches"), (snapshot) => {
        const list = document.getElementById("admin-matches-list");
        list.innerHTML = "";
        
        snapshot.forEach((matchDoc) => {
          const m = matchDoc.data(); 
          const id = matchDoc.id;
          
          // FILTRO MÁGICO: Si no sos el admin, y el correo asignado no es el tuyo, lo ignora y no te lo muestra.
          if(currentUserEmail !== correoAdmin && m.assignedUser !== currentUserEmail) {
              return; 
          }

          const div = document.createElement("div"); 
          div.className = "admin-card";
          div.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom: 15px;">
                <strong>${m.homeTeam} (${m.homeScore}) vs ${m.awayTeam} (${m.awayScore})</strong>
                <span style="color:var(--live-color);">${m.status}</span>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
              <button onclick="window.setMatchState('${id}', '1H', 0)" style="background:#0284C7;">▶️ 1er Tiempo</button>
              <button onclick="window.setMatchState('${id}', 'HT', 45)" style="background:#F59E0B; color:#000;">⏸️ Entretiempo</button>
              <button onclick="window.setMatchState('${id}', '2H', 45)" style="background:#0284C7;">▶️ 2do Tiempo</button>
              <button onclick="window.setMatchState('${id}', 'FINISHED', 90)" class="danger">⏹️ Finalizar</button>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button onclick="window.addGoal('${id}', 'home', '${m.homeTeam}')" style="background:#10B981;">⚽ Gol Local</button>
                <button onclick="window.addGoal('${id}', 'away', '${m.awayTeam}')" style="background:#10B981;">⚽ Gol Visitante</button>
            </div>

            <div style="display: flex; gap: 5px;">
                <input type="text" id="min-${id}" placeholder="Min" style="width: 25%;">
                <input type="text" id="player-${id}" placeholder="Jugador" style="width: 75%;">
            </div>
            <select id="type-${id}">
              <option value="Amarilla Local">🟨 Amarilla Local</option>
              <option value="Amarilla Visitante">🟨 Amarilla Visitante</option>
              <option value="Roja Local">🟥 Roja Local</option>
              <option value="Roja Visitante">🟥 Roja Visitante</option>
            </select>
            <button onclick="window.addEvent('${id}')" style="background:#444;">Guardar Tarjeta</button>
          `;
          list.appendChild(div);
        });
      });
    }

    // Funciones de actualización en Firebase
    window.setMatchState = async (id, status, baseMin) => {
      await updateDoc(doc(db, "matches", id), { status: status, baseMinute: baseMin, timerStartedAt: serverTimestamp() });
    };

    window.addGoal = async (id, team, teamName) => {
        const player = prompt(`¿Quién hizo el gol de ${teamName}?`) || 'Jugador';
        const min = prompt("¿En qué minuto? (Ej: 34')") || "0'";
        const type = team === 'home' ? 'Gol Local' : 'Gol Visitante';
        
        await updateDoc(doc(db, "matches", id), {
            events: arrayUnion({ minute: min, player: player, type: type }),
            [team + 'Score']: increment(1)
        });
    };

    window.addEvent = async (id) => {
      const min = document.getElementById(`min-${id}`).value + "'";
      const player = document.getElementById(`player-${id}`).value;
      const type = document.getElementById(`type-${id}`).value;
      if(!player) return alert("Falta el jugador");
      
      await updateDoc(doc(db, "matches", id), { events: arrayUnion({ minute: min, player: player, type: type }) });
      document.getElementById(`min-${id}`).value = ""; document.getElementById(`player-${id}`).value = "";
    };
  </script>
</body>
</html>
