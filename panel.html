<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control | Liga del Valle</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
      <div class="container nav-container">
          <a href="#" class="logo">Panel <span>Clubes</span></a>
      </div>
  </nav>

  <main class="container" style="padding-top: 100px; padding-bottom: 60px;">
    
    <!-- Login -->
    <div id="login-section" class="card" style="max-width: 400px; margin: 0 auto; text-align: center;">
      <h2>Iniciar Sesión</h2>
      <input type="email" id="email" placeholder="Correo electrónico">
      <input type="password" id="password" placeholder="Contraseña">
      <button id="btn-login" style="margin-top: 20px;">Ingresar</button>
      <p id="login-error" style="color: var(--live-color); margin-top:15px; font-weight: 600;"></p>
    </div>

    <!-- Admin -->
    <div id="admin-section" style="display:none;">
      
      <div class="card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; padding: 15px;">
        <span id="user-info" style="font-weight: 600; color: var(--primary-color);"></span>
        <button id="btn-logout" class="danger" style="width: auto; padding: 8px 15px; margin-top: 0;">Salir</button>
      </div>

      <div class="card" style="margin-bottom: 30px;">
        <h3>➕ Crear Partido</h3>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <input type="text" id="new-home" placeholder="Local" style="width: 40%;">
            <input type="text" id="new-away" placeholder="Visitante" style="width: 40%;">
            <input type="number" id="new-matchday" placeholder="Fecha N°" value="1" style="width: 20%;">
        </div>
        <button id="btn-create-match" style="margin-top: 15px;">Crear Partido</button>
      </div>

      <h3>⚙️ Control en Vivo</h3>
      <div id="admin-matches-list" class="matches-grid"></div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, arrayUnion, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyBRg-ZamZqFXK-cynKIt6X-FJXDCdD6Osg",
  authDomain: "liga-del-valle.firebaseapp.com",
  databaseURL: "https://liga-del-valle-default-rtdb.firebaseio.com",
  projectId: "liga-del-valle",
  storageBucket: "liga-del-valle.firebasestorage.app",
  messagingSenderId: "421001437016",
  appId: "1:421001437016:web:afeb2b18ca82b9bc850f2d"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ... (Lógica de login igual al anterior)
    const loginSection = document.getElementById("login-section");
    const adminSection = document.getElementById("admin-section");
    const btnLogin = document.getElementById("btn-login");
    const btnLogout = document.getElementById("btn-logout");

    btnLogin.addEventListener("click", () => {
      signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value);
    });
    btnLogout.addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.style.display = "none"; adminSection.style.display = "block";
        document.getElementById("user-info").textContent = user.email; loadAdminMatches();
      } else {
        loginSection.style.display = "block"; adminSection.style.display = "none";
      }
    });

    document.getElementById("btn-create-match").addEventListener("click", async () => {
      const home = document.getElementById("new-home").value; const away = document.getElementById("new-away").value;
      if(!home || !away) return alert("Faltan equipos");
      await addDoc(collection(db, "matches"), {
        homeTeam: home, awayTeam: away, homeScore: 0, awayScore: 0,
        status: "SCHEDULED", baseMinute: 0, addedTime: 0, matchday: parseInt(document.getElementById("new-matchday").value), events: [], date: serverTimestamp()
      });
      alert("Partido creado");
    });

    // Cargar Partidos para Administrar
    function loadAdminMatches() {
      onSnapshot(collection(db, "matches"), (snapshot) => {
        const list = document.getElementById("admin-matches-list");
        list.innerHTML = "";
        snapshot.forEach((matchDoc) => {
          const m = matchDoc.data(); const id = matchDoc.id;
          const div = document.createElement("div"); div.className = "card";
          
          div.innerHTML = `
            <div style="display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding-bottom:10px;">
                <strong>${m.homeTeam} (${m.homeScore}) vs ${m.awayTeam} (${m.awayScore})</strong>
                <span style="color:red; font-weight:bold;">${m.status}</span>
            </div>
            
            <!-- CONTROLES DE TIEMPO -->
            <p style="margin-top:10px; font-size:0.85rem; color:var(--text-gray);">1. CONTROL DE TIEMPO</p>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
              <button onclick="window.setMatchState('${id}', '1H', 0)" style="background:#2563EB;">▶️ Iniciar 1er T</button>
              <button onclick="window.setMatchState('${id}', 'HT', 45)" class="danger">⏸️ Fin 1er T (ET)</button>
              <button onclick="window.setMatchState('${id}', '2H', 45)" style="background:#2563EB;">▶️ Iniciar 2do T</button>
              <button onclick="window.setMatchState('${id}', 'FINISHED', 90)" class="danger" style="background:#000;">⏹️ Finalizar Partido</button>
            </div>
            
            <div style="display: flex; gap: 5px; margin-top: 10px;">
                <input type="number" id="addTime-${id}" placeholder="+Minutos" style="width: 50%;">
                <button onclick="window.addTime('${id}')" style="background:#F59E0B; width: 50%;">Sumar Tiempo</button>
            </div>

            <!-- EXTRAS POR LAS DUDAS -->
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <button onclick="window.setMatchState('${id}', 'ET1', 90)" style="background:#4B5563; font-size:0.8rem;">T. Extra</button>
                <button onclick="window.setMatchState('${id}', 'PENALTIES', 120)" style="background:#4B5563; font-size:0.8rem;">Penales</button>
            </div>

            <!-- MARCADOR RÁPIDO -->
            <p style="margin-top:15px; font-size:0.85rem; color:var(--text-gray);">2. MARCADOR</p>
            <div style="display: flex; gap: 10px;">
                <button onclick="window.addGoal('${id}', 'home', '${m.homeTeam}')" style="background:#10B981;">⚽ Gol Local</button>
                <button onclick="window.addGoal('${id}', 'away', '${m.awayTeam}')" style="background:#10B981;">⚽ Gol Visitante</button>
            </div>

            <!-- EVENTOS DETALLADOS -->
            <p style="margin-top:15px; font-size:0.85rem; color:var(--text-gray);">3. TARJETAS Y ESTADÍSTICAS</p>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="min-${id}" placeholder="Min (ej: 34)" style="width: 25%;">
                <input type="text" id="player-${id}" placeholder="Jugador" style="width: 75%;">
            </div>
            <select id="type-${id}">
              <option value="Amarilla Local 🟨">Amarilla Local</option>
              <option value="Roja Local 🟥">Roja Local</option>
              <option value="Amarilla Visit 🟨">Amarilla Visitante</option>
              <option value="Roja Visit 🟥">Roja Visitante</option>
              <option value="Corner Local ⛳">Córner Local</option>
              <option value="Corner Visit ⛳">Córner Visitante</option>
            </select>
            <button onclick="window.addEvent('${id}')" style="background-color: var(--text-dark);">Guardar Evento</button>
          `;
          list.appendChild(div);
        });
      });
    }

    // --- FUNCIONES MÁGICAS ---

    // Cambiar estado e iniciar el reloj en Firebase
    window.setMatchState = async (id, status, baseMin) => {
      if(confirm(`¿Estás seguro de pasar a ${status}?`)) {
          await updateDoc(doc(db, "matches", id), { 
              status: status, 
              baseMinute: baseMin,
              timerStartedAt: serverTimestamp(),
              addedTime: 0 // Resetea el tiempo extra al cambiar de tiempo
          });
      }
    };

    // Agregar tiempo extra al reloj
    window.addTime = async (id) => {
        const time = parseInt(document.getElementById(`addTime-${id}`).value);
        if(!time) return;
        await updateDoc(doc(db, "matches", id), { addedTime: time });
        document.getElementById(`addTime-${id}`).value = '';
    };

    // Sumar Gol directo (Suma al marcador y al historial)
    window.addGoal = async (id, team, teamName) => {
        const player = prompt(`¿Quién hizo el gol de ${teamName}? (Dejar en blanco si no sabes)`) || 'Jugador';
        const min = prompt('¿En qué minuto?') || '';
        
        const updateData = {
            events: arrayUnion({ minute: min, player: player, type: team === 'home' ? 'Gol Local ⚽' : 'Gol Visitante ⚽' })
        };
        // Incrementar el marcador usando la función nativa de Firebase
        if(team === 'home') updateData.homeScore = increment(1);
        if(team === 'away') updateData.awayScore = increment(1);

        await updateDoc(doc(db, "matches", id), updateData);
    };

    // Agregar Tarjetas o Corners
    window.addEvent = async (id) => {
      const min = document.getElementById(`min-${id}`).value || '';
      const player = document.getElementById(`player-${id}`).value || 'Equipo';
      const type = document.getElementById(`type-${id}`).value;
      
      await updateDoc(doc(db, "matches", id), {
        events: arrayUnion({ minute: min, player: player, type: type })
      });

      document.getElementById(`min-${id}`).value = "";
      document.getElementById(`player-${id}`).value = "";
    };
  </script>
</body>
</html>
