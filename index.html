<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liga del Valle - Resultados en Vivo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- VISTA 1: LISTA DE PARTIDOS -->
  <div id="view-list" class="container">
    <div style="text-align: center; margin: 20px 0;">
        <h1 style="font-size: 1.5rem; text-transform: uppercase;">Liga del Valle</h1>
    </div>
    
    <div class="jornada-title">Partidos de la Fecha</div>
    <div id="matches-list">
        <p style="text-align:center; padding: 20px;">Cargando resultados...</p>
    </div>
  </div>

  <!-- VISTA 2: DETALLE DEL PARTIDO -->
  <div id="view-detail" class="container" style="display: none;">
    <div class="match-detail-header">
        <button class="btn-back" onclick="showList()">⬅ Volver</button>
        <div class="detail-league">Liga del Valle</div>
        
        <div class="detail-scoreboard">
            <div id="det-home-team" class="detail-team home">Local</div>
            <div class="detail-score-center">
                <div id="det-min" class="min">0'</div>
                <div id="det-score" class="score">0 - 0</div>
            </div>
            <div id="det-away-team" class="detail-team away">Visitante</div>
        </div>
    </div>

    <div class="eventos-title">Eventos Clave</div>
    <div id="det-timeline" class="timeline">
        <!-- Eventos se cargan aquí -->
    </div>
  </div>

  <footer class="footer-sierras">
      Desarrollo y tecnología por <a href="#" target="_blank">Sierras Web</a>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyBRg-ZamZqFXK-cynKIt6X-FJXDCdD6Osg",
  authDomain: "liga-del-valle.firebaseapp.com",
  databaseURL: "https://liga-del-valle-default-rtdb.firebaseio.com",
  projectId: "liga-del-valle",
  storageBucket: "liga-del-valle.firebasestorage.app",
  messagingSenderId: "421001437016",
  appId: "1:421001437016:web:afeb2b18ca82b9bc850f2d"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allMatches = {}; // Guardamos los partidos para ver el detalle sin recargar

    // Control de vistas
    window.showList = () => {
        document.getElementById('view-list').style.display = 'block';
        document.getElementById('view-detail').style.display = 'none';
    };

    window.showDetail = (id) => {
        const m = allMatches[id];
        if(!m) return;
        
        document.getElementById('det-home-team').textContent = m.homeTeam;
        document.getElementById('det-away-team').textContent = m.awayTeam;
        document.getElementById('det-score').textContent = `${m.homeScore} - ${m.awayScore}`;
        
        const minEl = document.getElementById('det-min');
        minEl.textContent = getDisplayTime(m);
        minEl.className = ['1H', '2H', 'ET1', 'ET2'].includes(m.status) ? 'min live' : 'min';

        // Renderizar línea de tiempo (Eventos Clave)
        const tl = document.getElementById('det-timeline');
        tl.innerHTML = '';
        
        if(m.events && m.events.length > 0) {
            // Ordenar eventos por minuto (aproximado, asumiendo formato "34'")
            let sortedEvents = m.events.sort((a, b) => parseInt(a.minute) - parseInt(b.minute));
            
            sortedEvents.forEach(evt => {
                const isHome = evt.type.includes("Local");
                const icon = evt.type.includes("Gol") ? "⚽" : (evt.type.includes("Roja") ? "🟥" : (evt.type.includes("Amarilla") ? "🟨" : ""));
                
                if(!icon) return; // Ocultar corners de la vista principal si queremos

                const contentStr = `<strong>${evt.player}</strong> ${icon}`;
                
                tl.innerHTML += `
                    <div class="timeline-event">
                        <div class="event-left">${isHome ? contentStr : ''}</div>
                        <div class="event-minute">${evt.minute}</div>
                        <div class="event-right">${!isHome ? icon + ' <strong>' + evt.player + '</strong>' : ''}</div>
                    </div>
                `;
            });
        } else {
            tl.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">Aún no hay eventos clave.</p>';
        }

        document.getElementById('view-list').style.display = 'none';
        document.getElementById('view-detail').style.display = 'block';
    };

    function getDisplayTime(m) {
        if (m.status === 'SCHEDULED') return 'PROG';
        if (m.status === 'HT') return 'MT';
        if (m.status === 'FINISHED') return 'FIN';
        if (!m.timerStartedAt) return m.status;

        const startMillis = m.timerStartedAt.toMillis();
        const diffMinutes = Math.floor((Date.now() - startMillis) / 60000);
        let currentMin = m.baseMinute + diffMinutes;
        
        if (m.status === '1H' && currentMin > 45) return `45'+`;
        if (m.status === '2H' && currentMin > 90) return `90'+`;
        return `${currentMin}'`;
    }

    const q = query(collection(db, "matches"), orderBy("date", "desc"));
    onSnapshot(q, (snapshot) => {
      const listDiv = document.getElementById("matches-list");
      listDiv.innerHTML = "";
      
      snapshot.forEach((doc) => {
        const m = doc.data();
        allMatches[doc.id] = m;
        
        let isLive = ['1H', '2H', 'ET1', 'ET2'].includes(m.status);
        let timeText = getDisplayTime(m);
        let minClass = isLive ? 'match-minute live' : 'match-minute';

        listDiv.innerHTML += `
          <div class="match-row" onclick="showDetail('${doc.id}')">
              <div class="${minClass}">${timeText}</div>
              <div class="match-teams">
                  <div class="team home">${m.homeTeam}</div>
                  <div class="score-box">${m.homeScore} <span>|</span> ${m.awayScore}</div>
                  <div class="team away">${m.awayTeam}</div>
              </div>
          </div>
        `;
      });
      
      // Si estamos viendo un detalle, actualizarlo en vivo
      if(document.getElementById('view-detail').style.display === 'block') {
          // Buscamos qué partido estamos viendo por el nombre (método rústico pero efectivo)
          // Lo ideal sería guardar el ID activo
      }
    });

    setInterval(() => {
        // Refrescar relojes
    }, 60000);
  </script>
</body>
</html>
