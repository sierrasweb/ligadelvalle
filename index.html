<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liga del Valle | En Vivo</title>
  
  <!-- Fuente Profesional Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar con Glassmorphism -->
  <nav class="navbar" id="navbar">
      <div class="container nav-container">
          <a href="#" class="logo">Liga del <span>Valle</span></a>
          <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar Tema">
              <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
              <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="5"></circle>
                  <line x1="12" y1="1" x2="12" y2="3"></line>
                  <line x1="12" y1="21" x2="12" y2="23"></line>
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                  <line x1="1" y1="12" x2="3" y2="12"></line>
                  <line x1="21" y1="12" x2="23" y2="12"></line>
                  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                  <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
          </button>
      </div>
  </nav>

  <header class="hero container">
    <div class="hero-badge">Temporada Oficial</div>
    <h1>Sigue tu pasión, <span>minuto a minuto.</span></h1>
    <p style="color: var(--text-gray); font-size: 1.1rem;">Resultados oficiales, estadísticas y tabla de posiciones de la Liga del Valle en tiempo real.</p>
  </header>

  <main class="container">
    <div id="matches-container" class="matches-grid">
      <p style="text-align:center; color: var(--text-gray);">Cargando la fecha actual...</p>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyBRg-ZamZqFXK-cynKIt6X-FJXDCdD6Osg",
  authDomain: "liga-del-valle.firebaseapp.com",
  databaseURL: "https://liga-del-valle-default-rtdb.firebaseio.com",
  projectId: "liga-del-valle",
  storageBucket: "liga-del-valle.firebasestorage.app",
  messagingSenderId: "421001437016",
  appId: "1:421001437016:web:afeb2b18ca82b9bc850f2d"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const matchesContainer = document.getElementById("matches-container");

    const q = query(collection(db, "matches"), orderBy("date", "desc"));
    
    onSnapshot(q, (snapshot) => {
      matchesContainer.innerHTML = "";
      if (snapshot.empty) {
        matchesContainer.innerHTML = "<p style='text-align:center;'>No hay partidos programados.</p>";
        return;
      }
      snapshot.forEach((doc) => {
        const match = doc.data();
        const card = document.createElement("div");
        card.className = "card";

        let statusBadge = match.status === "LIVE" ? `<span class="badge-live">EN VIVO ${match.minute || ''}</span>` : 
                          match.status === "FINISHED" ? `<span>FINALIZADO</span>` : `<span>PROGRAMADO</span>`;

        let eventsHTML = "";
        if (match.events && match.events.length > 0) {
          eventsHTML = `<div class="timeline">`;
          match.events.forEach(evt => {
            eventsHTML += `<div class="event-item">⏱️ ${evt.minute} - <strong>${evt.type}</strong>: ${evt.player}</div>`;
          });
          eventsHTML += `</div>`;
        }

        card.innerHTML = `
          <div class="match-header">
            <span>FECHA ${match.matchday || 1}</span>
            ${statusBadge}
          </div>
          <div class="scoreboard">
            <div class="team-name">${match.homeTeam}</div>
            <div class="score-box">${match.homeScore} - ${match.awayScore}</div>
            <div class="team-name">${match.awayTeam}</div>
          </div>
          ${eventsHTML}
        `;
        matchesContainer.appendChild(card);
      });
    });

    // --- LÓGICA DEL MODO OSCURO ---
    const themeToggleBtn = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
        htmlElement.setAttribute('data-theme', 'dark');
    }

    themeToggleBtn.addEventListener('click', () => {
        if (htmlElement.getAttribute('data-theme') === 'dark') {
            htmlElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
        } else {
            htmlElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
    });
  </script>
</body>
</html>
