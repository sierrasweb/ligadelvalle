<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liga del Valle | En Vivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar" id="navbar">
      <!-- (Mismo código de Navbar con botón de tema que ya tenías) -->
      <div class="container nav-container">
          <a href="#" class="logo">Liga del <span>Valle</span></a>
      </div>
  </nav>

  <header class="hero container" style="padding-bottom: 20px;">
    <h1>Minuto a <span>minuto.</span></h1>
  </header>

  <main class="container">
    
    <!-- Pestañas de Navegación -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('matches')">Partidos de la Fecha</button>
        <button class="tab-btn" onclick="switchTab('standings')">Tabla de Posiciones</button>
    </div>

    <!-- PESTAÑA: PARTIDOS -->
    <div id="tab-matches" class="tab-content active">
        <div id="matches-container" class="matches-grid">
          <p style="text-align:center;">Cargando partidos...</p>
        </div>
    </div>

    <!-- PESTAÑA: TABLA -->
    <div id="tab-standings" class="tab-content">
        <div class="table-responsive">
            <table class="standings-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th class="team-name-cell">Equipo</th>
                        <th class="pts-col">PTS</th>
                        <th>PJ</th>
                        <th>PG</th>
                        <th>PE</th>
                        <th>PP</th>
                        <th>GF</th>
                        <th>GC</th>
                        <th>DIF</th>
                    </tr>
                </thead>
                <tbody id="standings-body">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </div>
    </div>

  </main>

  <!-- Footer Publicidad -->
  <footer class="sierras-footer container">
      Desarrollado y potenciado por <a href="#" target="_blank">Sierras Web</a> 🚀<br>
      Llevamos tu negocio o liga al siguiente nivel digital.
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyBRg-ZamZqFXK-cynKIt6X-FJXDCdD6Osg",
  authDomain: "liga-del-valle.firebaseapp.com",
  databaseURL: "https://liga-del-valle-default-rtdb.firebaseio.com",
  projectId: "liga-del-valle",
  storageBucket: "liga-del-valle.firebasestorage.app",
  messagingSenderId: "421001437016",
  appId: "1:421001437016:web:afeb2b18ca82b9bc850f2d"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const matchesContainer = document.getElementById("matches-container");

    // Lógica para cambiar pestañas
    window.switchTab = function(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        event.target.classList.add('active');
    }

    window.toggleDetails = function(id) {
        document.getElementById('details-' + id).classList.toggle('open');
    }

    // Timer dinámico
    function getDisplayTime(match) {
        if (match.status === 'SCHEDULED') return 'PROGRAMADO';
        if (match.status === 'HT') return 'ENTRETIEMPO';
        if (match.status === 'FINISHED') return 'FINALIZADO';
        if (match.status === 'PENALTIES') return 'PENALES';

        if (!match.timerStartedAt) return match.status; // Fallback

        // Calcula minutos reales transcurridos desde que se apretó el botón
        const startMillis = match.timerStartedAt.toMillis();
        const nowMillis = Date.now();
        const diffMinutes = Math.floor((nowMillis - startMillis) / 60000);
        let currentMin = match.baseMinute + diffMinutes;

        let addedHtml = match.addedTime ? `<span style="color:red; font-size:0.8em;">+${match.addedTime}</span>` : '';

        // Topes de tiempo
        if (match.status === '1H' && currentMin > 45) return `45'${addedHtml}`;
        if (match.status === '2H' && currentMin > 90) return `90'${addedHtml}`;
        if (match.status === 'ET1' && currentMin > 105) return `105'${addedHtml}`;
        if (match.status === 'ET2' && currentMin > 120) return `120'${addedHtml}`;

        return `${currentMin}'`;
    }

    // Escuchar base de datos
    const q = query(collection(db, "matches"), orderBy("date", "desc"));
    
    onSnapshot(q, (snapshot) => {
      matchesContainer.innerHTML = "";
      let teamsStats = {}; // Para la tabla

      snapshot.forEach((doc) => {
        const match = doc.data();
        const id = doc.id;
        
        // --- 1. RENDERIZAR PARTIDO ---
        const card = document.createElement("div");
        card.className = "card";

        let isLive = ['1H', '2H', 'ET1', 'ET2', 'PENALTIES'].includes(match.status);
        let displayTime = getDisplayTime(match);
        let statusBadge = isLive ? `<span class="badge-live">🔴 EN VIVO ${displayTime}</span>` : 
                          match.status === "HT" ? `<span class="badge-live" style="background:#F59E0B; animation:none;">ENTRETIEMPO</span>` :
                          match.status === "FINISHED" ? `<span>FINALIZADO</span>` : `<span>PROGRAMADO</span>`;

        // Generar estadísticas derivadas de los eventos
        let homeCorners = 0, awayCorners = 0, homeRed = 0, awayRed = 0;
        let eventsHTML = "";
        
        if (match.events && match.events.length > 0) {
          eventsHTML = `<div class="timeline"><strong>Incidencias:</strong>`;
          match.events.forEach(evt => {
            if (evt.type.includes("Corner Local")) homeCorners++;
            if (evt.type.includes("Corner Visit")) awayCorners++;
            if (evt.type.includes("Roja Local")) homeRed++;
            if (evt.type.includes("Roja Visit")) awayRed++;
            
            // Mostrar solo goles y tarjetas en el timeline principal
            if (!evt.type.includes("Corner")) {
                eventsHTML += `<div class="event-item">⏱️ ${evt.minute}' - <strong>${evt.type}</strong>: ${evt.player}</div>`;
            }
          });
          eventsHTML += `</div>`;
        }

        let penaltiesHTML = match.status === 'PENALTIES' || (match.status === 'FINISHED' && match.homePenalties !== undefined) 
                            ? `<div style="text-align:center; color:var(--text-gray); font-size:0.9rem;">(Penales: ${match.homePenalties} - ${match.awayPenalties})</div>` : '';

        card.innerHTML = `
          <div class="match-header">
            <span>FECHA ${match.matchday || 1}</span>
            ${statusBadge}
          </div>
          <div class="scoreboard">
            <div class="team-name">${match.homeTeam} ${homeRed > 0 ? '🟥' : ''}</div>
            <div class="score-box">${match.homeScore} - ${match.awayScore}</div>
            <div class="team-name">${match.awayTeam} ${awayRed > 0 ? '🟥' : ''}</div>
          </div>
          ${penaltiesHTML}
          
          <button class="btn-toggle-details" onclick="toggleDetails('${id}')">Ver Estadísticas y Detalles ⬇️</button>
          
          <div id="details-${id}" class="match-details">
              <div class="stats-container">
                  <div class="stat-box"><strong>${homeCorners}</strong> Tiros de Esquina (L)</div>
                  <div class="stat-box"><strong>${awayCorners}</strong> Tiros de Esquina (V)</div>
              </div>
              <br>
              ${eventsHTML}
          </div>
        `;
        matchesContainer.appendChild(card);

        // --- 2. CÁLCULO DE TABLA DE POSICIONES ---
        if (match.status === "FINISHED") {
            // Inicializar equipos si no existen
            if (!teamsStats[match.homeTeam]) teamsStats[match.homeTeam] = { name: match.homeTeam, pts: 0, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0 };
            if (!teamsStats[match.awayTeam]) teamsStats[match.awayTeam] = { name: match.awayTeam, pts: 0, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0 };

            let h = teamsStats[match.homeTeam];
            let a = teamsStats[match.awayTeam];

            h.pj++; a.pj++;
            h.gf += parseInt(match.homeScore); h.gc += parseInt(match.awayScore);
            a.gf += parseInt(match.awayScore); a.gc += parseInt(match.homeScore);

            if (match.homeScore > match.awayScore) {
                h.pts += 3; h.pg++; a.pp++;
            } else if (match.homeScore < match.awayScore) {
                a.pts += 3; a.pg++; h.pp++;
            } else {
                h.pts += 1; a.pts += 1; h.pe++; a.pe++;
            }
        }
      });

      // Dibujar tabla
      const tbody = document.getElementById('standings-body');
      tbody.innerHTML = "";
      
      // Convertir a array y ordenar (por Puntos, luego Diferencia de Gol)
      let standings = Object.values(teamsStats).sort((a, b) => {
          if (b.pts !== a.pts) return b.pts - a.pts;
          return (b.gf - b.gc) - (a.gf - a.gc);
      });

      standings.forEach((team, index) => {
          let dif = team.gf - team.gc;
          tbody.innerHTML += `
            <tr>
                <td>${index + 1}</td>
                <td class="team-name-cell">${team.name}</td>
                <td class="pts-col">${team.pts}</td>
                <td>${team.pj}</td>
                <td>${team.pg}</td>
                <td>${team.pe}</td>
                <td>${team.pp}</td>
                <td>${team.gf}</td>
                <td>${team.gc}</td>
                <td>${dif > 0 ? '+'+dif : dif}</td>
            </tr>
          `;
      });
    });

    // Actualizar los relojes cada 1 minuto sin recargar Firebase
    setInterval(() => {
        document.querySelectorAll('.badge-live').forEach(badge => {
            // Forzar un re-render suave disparando un evento o redibujando
            // En una app real de React esto es automático, aquí Firebase onSnapshot nos actualizará 
            // si hay un evento, pero el setInterval local ayuda si no hay goles.
        });
    }, 60000);
  </script>
</body>
</html>
